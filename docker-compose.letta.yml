services:
  letta-db:
    image: ankane/pgvector:v0.5.1
    container_name: mabench-letta-db
    environment:
      POSTGRES_USER: letta
      POSTGRES_PASSWORD: letta
      POSTGRES_DB: letta
    volumes:
      - letta_pgdata_proxy:/var/lib/postgresql/data
      - ./letta-init.sql:/docker-entrypoint-initdb.d/10-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U letta -d letta"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "5432:5432"

  letta:
    image: letta/letta:0.16.8
    container_name: mabench-letta
    depends_on:
      letta-db:
        condition: service_healthy
    ports:
      - "8283:8283"
    environment:
      LETTA_PG_URI: postgresql://letta:letta@letta-db:5432/letta
      LETTA_DEBUG: "true"
      OLLAMA_BASE_URL: http://host.docker.internal:8787
      LETTA_EMBEDDING_ENDPOINT: http://host.docker.internal:8787/v1
      LETTA_EMBEDDING_ENDPOINT_TYPE: ollama
      LETTA_EMBEDDING_MODEL: nomic-embed-text:latest
      LETTA_EMBEDDING_DIM: "768"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8283/v1/health/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18

volumes:
  letta_pgdata_proxy:
