[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mabench-rc"
version = "0.1.0"
description = "Benchmarking reflection-subsystem security and availability in LLM agent memory"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "sentence-transformers==6.0.0",
    "letta-client==1.12.1",
    "fastapi==0.135.1",
    "uvicorn==0.41.0",
    "httpx==0.28.1",
    "psutil==7.2.2",
    "numpy==1.26.4",
    "pandas==3.0.5",
    "scipy==1.17.1",
    "matplotlib==3.11.1",
    "seaborn==0.13.2",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
mem0 = ["mem0ai==2.0.18", "chromadb==1.5.9"]

[tool.setuptools.packages.find]
include = ["mabench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
